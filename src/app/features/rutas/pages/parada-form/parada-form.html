<section class="page">
  <header class="page__header">
    <h1 class="page__title">{{ esEdicion() ? 'Editar parada' : 'Nueva parada' }}</h1>
    <button class="btn btn--secondary" type="button" (click)="volver()">Volver</button>
  </header>

  @if (error()) {
    <div class="alert alert--danger">{{ error() }}</div>
  }

  <form class="form__card form" [formGroup]="form" (ngSubmit)="onSubmit()">
    @if (loading()) {
      <div class="form__loading">Cargando…</div>
    }

    <div class="form__grid">
      <div class="form__field">
        <label class="form__label" for="codigo">Código *</label>
        <input class="form__input" id="codigo" formControlName="codigo" maxlength="20" />
        @if (mostrarError('codigo')) {
          <span class="form__error">El código es obligatorio.</span>
        }
      </div>

      <div class="form__field">
        <label class="form__label" for="nombre">Nombre *</label>
        <input class="form__input" id="nombre" formControlName="nombre" maxlength="100" />
        @if (mostrarError('nombre')) {
          <span class="form__error">El nombre es obligatorio.</span>
        }
      </div>

      <div class="form__field">
        <label class="form__label" for="direccion">Dirección</label>
        <input class="form__input" id="direccion" formControlName="direccion" maxlength="200" />
      </div>

      <div class="form__field">
        <label class="form__label" for="ubicacion_referencia">Ubicación de referencia</label>
        <input
          class="form__input"
          id="ubicacion_referencia"
          formControlName="ubicacion_referencia"
          maxlength="200"
        />
      </div>
    </div>

    <div class="form__actions">
      <button class="btn btn--secondary" type="button" (click)="volver()">Cancelar</button>
      <button class="btn btn--primary" type="submit" [disabled]="loading()">
        {{ loading() ? 'Guardando…' : esEdicion() ? 'Guardar cambios' : 'Crear parada' }}
      </button>
    </div>
  </form>
</section>
